name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  verify:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter config --no-analytics
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test
        run: flutter test --coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build-apk:
    name: Debug APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # The Gradle distribution download from GitHub intermittently returns
      # 5xx; fetch it in its own retried step so a blip does not fail the job.
      - name: Fetch Gradle distribution
        run: |
          flutter build apk --config-only
          cd android
          for attempt in 1 2 3 4; do
            ./gradlew --version -q && exit 0
            echo "Gradle download failed (attempt $attempt), retrying"
            sleep 20
          done
          exit 1
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: ollama-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
