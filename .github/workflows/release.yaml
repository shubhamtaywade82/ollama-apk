name: Release

# Tags only: a manual dispatch could sign an APK from any unreviewed branch
# with the release keystore.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.4"

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # Fail closed: without these the build would fall back to the debug
        # key and a tag would publish an APK nobody can update safely.
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS; do
            if [ -z "${!name}" ]; then
              echo "::error::Release signing secret for $name is missing"
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      # The Gradle distribution download from GitHub intermittently returns
      # 5xx; fetch it in its own retried step so a blip does not fail the job.
      - name: Fetch Gradle distribution
        run: |
          flutter build apk --config-only
          cd android
          for attempt in 1 2 3 4; do
            ./gradlew --version -q && exit 0
            echo "Gradle download failed (attempt $attempt), retrying"
            sleep 20
          done
          exit 1

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --split-debug-info=build/symbols

      - name: Name artifacts by version
        id: meta
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed 's/app-\(.*\)-release.apk/\1/')
            mv "$f" "build/app/outputs/flutter-apk/ollama-apk-v${version}-${abi}.apk"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify release signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          {
            echo "### Signing certificate"
            echo
          } > release-notes.md
          for apk in build/app/outputs/flutter-apk/ollama-apk-v*.apk; do
            certs=$("$apksigner" verify --print-certs "$apk")
            if echo "$certs" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is signed with the debug key"
              exit 1
            fi
          done
          "$apksigner" verify --print-certs "$apk" \
            | grep "certificate SHA-256 digest" | head -1 \
            | sed 's/^/    /' >> release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: ollama-apk-v${{ steps.meta.outputs.version }}
          path: build/app/outputs/flutter-apk/ollama-apk-v*.apk

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: release-notes.md
          files: build/app/outputs/flutter-apk/ollama-apk-v*.apk
